onboarding = false

[theme]
name = "terminal"
auto_switch = false

[keys]
previous_agent = "prefix+["
next_agent = "prefix+]"
# Written as the shifted characters, not "shift+[": the terminal delivers
# { and }, so a shift+bracket binding parses but never matches a keypress.
previous_workspace = "prefix+{"
next_workspace = "prefix+}"
previous_tab = "prefix+p"
next_tab = "prefix+n"
# tmux.conf leaves tmux's split bindings at their defaults (% side-by-side,
# " stacked) — mirrored here so the muscle memory carries over.
split_vertical = "prefix+%"
split_horizontal = "prefix+quote"

[ui]
agent_panel_sort = "priority"

[ui.sound]
enabled = false
