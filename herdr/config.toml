onboarding = false

[theme]
name = "terminal"
auto_switch = false

# Two override groups on the terminal base (which keeps pane content matching
# Ghostty exactly, while these restyle herdr's own frame):
#
# Structural tokens copy the built-in catppuccin (Mocha) palette verbatim —
# the terminal theme maps them to bare ANSI (surface0=reset, mauve=gray,
# accent=ANSI blue), which is what reads as raw. Sourced from
# Palette::catppuccin() in herdr's src/app/state.rs; matches Ghostty's
# Catppuccin Mocha.
#
# Agent-state colors (blocked=red, working=yellow, done=teal, idle=green in
# src/ui/status.rs) use Okabe-Ito instead of Mocha's: hue-true to the
# semantics but separable under red-green color-vision deficiency. Drop these
# four once ui.status_indicators (unreleased as of 0.8.0) ships and shapes
# disambiguate the states instead.
[theme.custom]
accent = "#89b4fa"
panel_bg = "#181825"
# Unreleased as of 0.8.0. When it ships: midpoint of Mocha base (#1e1e2e,
# the Ghostty pane bg) and surface0, lifting the sidebar slightly off the
# main pane without jumping a full surface step.
# sidebar_bg = "#272839"
surface0 = "#313244"
surface1 = "#45475a"
surface_dim = "#1e1e2e"
overlay0 = "#6c7086"
overlay1 = "#7f849c"
text = "#cdd6f4"
subtext0 = "#a6adc8"
mauve = "#cba6f7"
peach = "#fab387"
blue = "#89b4fa"
red = "#D55E00"    # vermillion — blocked
yellow = "#F0E442" # bright yellow — working
teal = "#56B4E9"   # sky blue — done
green = "#009E73"  # bluish green — idle

[keys]
previous_agent = "prefix+["
next_agent = "prefix+]"
# prefix+N jumps to the Nth agent row; with priority sort, prefix+1 is always
# the agent that most needs attention. Takes over prefix+1..9 from switch_tab
# (tabs keep prefix+p/n cycling).
focus_agent = "prefix+1..9"
switch_tab = ""
# Written as the shifted characters, not "shift+[": the terminal delivers
# { and }, so a shift+bracket binding parses but never matches a keypress.
previous_workspace = "prefix+{"
next_workspace = "prefix+}"
previous_tab = "prefix+p"
next_tab = "prefix+n"
# tmux.conf leaves tmux's split bindings at their defaults (% side-by-side,
# " stacked) — mirrored here so the muscle memory carries over.
split_vertical = "prefix+%"
split_horizontal = "prefix+quote"

[ui]
agent_panel_sort = "priority"
# Unreleased as of 0.8.0. When it ships: distinct shape per state (× blocked,
# ◐ working, ✓ done, ○ idle), readable under color-vision deficiency with no
# palette override needed — enable and drop [theme.custom].
# status_indicators = "symbols"
prompt_new_tab_name = false

# One line per agent (drop the default second agent-kind row: everything here
# is Claude Code) so twice as many agents fit in the panel. Tab first: it
# carries the agent-specific task name, while the space is shared context
# (dimmed) — in a multi-tab space, space-first would render identical rows.
# No fractional spacing exists in a terminal grid, so the half-gap is faked:
# each entry's second row carries dim info (the space name / the branch) and
# doubles as the visual separator, instead of spending a blank row on it.
[ui.sidebar.agents]
row_gap = 0
rows = [["state_icon", { token = "tab", fg = "#cdd6f4", bold = true }], [{ token = "workspace", bold = false, dim = true }]]

[ui.sidebar.spaces]
row_gap = 0
rows = [["state_icon", "workspace"], [{ token = "branch", dim = true }, { token = "git_status", dim = true }]]

[ui.sound]
enabled = false
