onboarding = false

[theme]
name = "terminal"
auto_switch = false

[keys]
previous_agent = "prefix+["
next_agent = "prefix+]"
previous_workspace = "prefix+shift+["
next_workspace = "prefix+shift+]"
previous_tab = "prefix+p"
next_tab = "prefix+n"
# tmux.conf leaves tmux's split bindings at their defaults (% side-by-side,
# " stacked) — mirrored here so the muscle memory carries over.
split_vertical = "prefix+%"
split_horizontal = "prefix+quote"

[ui]
agent_panel_sort = "priority"

[ui.sound]
enabled = false
