[meta]
version = 1
name = "Omarchy"
description = "Follow your Omarchy system theme."
variant = "dark"
inherits = "vicinae-dark"
icon = "/home/atif/.local/share/omarchy/icon.png"

[colors.core]
background = "#0f1011"
foreground = "#dfe1e5"
secondary_background = "#232333"
border = "#43454a"
accent = "#f9e2af"

[colors.list.item.hover]
background = "#282838"
foreground = "#dfe1e5"

[colors.list.item.selection]
background = "#2d2d3d"
foreground = "#dfe1e5"

[colors.accents]
blue = "#7d9cc9"
green = "#56b09a"
magenta = "#f5c2e7"
orange = "#f9e2af"
purple = "#f5c2e7"
red = "#e57a3f"
yellow = "#f9e2af"
cyan = "#94e2d5"
